# Generated from stack/variables.tf by a one-off script and kept in step by a test (tests/cli.sh settings_match).
# What a canvas shows as a stack's settings: type and default are the HCL text.
variables:
  - name: zone
    required: true
    type: "string"
    description: "The domain the records go in, e.g. example.com."
  - name: create_zone
    required: false
    type: "bool"
    default: "true"
    description: "Make the zone here. false uses a zone that already exists at the provider."
  - name: records
    required: false
    type: "map(object({ host = optional(string) type = optional(string, \"A\") value = optional(string) ttl = optional(number, 3600) }))"
    default: "{}"
    description: "Records to keep, keyed by name under the zone (api is api.<zone>). A host (<provider>-<instance>, e.g. oci-main) is an A record to its public IP; or give a value (and a type: A, AAAA, CNAME or TXT) yourself."
  - name: inventory_state_path
    required: false
    type: "string"
    default: "null"
    description: "State file of hybrid/. null means ../../../hybrid/terraform.tfstate in this checkout; bin/freelunch passes the project's."
