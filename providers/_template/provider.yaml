# Copy this folder to providers/<name>/ and fill in every field.
# Schema (validated by `bin/freelunch catalog`):
name: example                     # must equal the folder name
display_name: "Example Cloud"
category: vps                     # a key from catalog/categories.yaml
status: planned                   # ready | planned | excluded
layer: host                       # host (Docker hosts) | service (managed service) | glue (consumes hybrid inventory)
terraform_provider: "example/example"   # registry address, or null when none exists
iac: partner                      # official | partner | community | stale | none (must be none when terraform_provider is null)
engine: tofu                      # optional: tofu | api | cli | guided. Default: tofu, or guided when iac is stale or none
# always_on: "yes"                # optional: "yes" (never sleeps) or "no" (sleeps when unused). Shown as "always on" or "sleeps after N min"
# sleeps_after_minutes: 15        # optional, only with always_on: "no": minutes without requests before it sleeps
# free_memory_mb: 1024            # optional: the most memory a free workload gets there, in MB (freelunch fit compares an app's limits with it)
# volumes: "no"                   # optional: "no" when freelunch makes no Docker volumes there (a platform without them); default yes
# node_types: [database]         # optional: what it can make, for a canvas's palette: host, platform, app, database, bucket, service, tunnel, route, zone, mesh. Default: from layer and category
# jobs: [provision, ci, cd]       # optional: what the provider supports in a workflow
# verified: fake-api              # optional, once implemented: fake-api (a test double) | live (a real account has run it)
free_tier_type: always-free       # always-free | monthly-credit | trial | startup-credits | none
free_tier: "One-line summary of what is free, with numbers"
card_required: "unknown"          # "yes" | "no" | "unknown"
url: "https://example.com/pricing"
last_verified: "YYYY-MM-DD"
notes: null                       # gotchas: sleeping, expiry, card holds, regional limits...
sources:                          # where the free-tier facts came from, with dates
  - "example.com/pricing (YYYY-MM-DD)"
inspire: []                       # related paths under inspire/

# Host providers: free-tier limits enforced by the modules' preconditions.
# limits:
#   compute:
#     idle: { percent: 20, days: 7 }   # optional: the provider reclaims a machine below this much use (p95) for this many days
#   storage: {}
