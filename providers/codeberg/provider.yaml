last_verified: "2026-10-19"
notes: "Only for projects under a free/libre licence; private repos are limited to what FLOSS projects need. Run by Codeberg e.V., a non-profit funded by donations. The pipeline is written from a template (freelunch ci init, docs/ci.md#other-ci-systems) and has not run on a real account."
sources:
