# Generated from stack/variables.tf by a one-off script and kept in step by a test (tests/cli.sh settings_match).
# What a canvas shows as a stack's settings: type and default are the HCL text.
variables:
  - name: project_id
    required: true
    type: "string"
    description: "Project to deploy into. It must be linked to a billing account (the free tier still needs one)."
  - name: region
    required: false
    type: "string"
    default: "\"us-central1\""
    description: "us-west1, us-central1 or us-east1: the only regions with a free e2-micro."
  - name: enable_compute_api
    required: false
    type: "bool"
    default: "true"
    description: "Enable compute.googleapis.com in the project. Set false if it is already enabled and the credentials can't manage services."
  - name: name_prefix
    required: false
    type: "string"
    default: "\"freelunch\""
    description: "Prefix for all resource names."
  - name: ssh_public_keys
    required: true
    type: "list(string)"
    description: "SSH public keys authorized on every instance (user `ubuntu`)."
  - name: ssh_source_cidrs
    required: false
    type: "list(string)"
    default: "[\"0.0.0.0/0\"]"
    description: "CIDRs allowed to reach SSH. Use your own IP (x.x.x.x/32), or [] with Tailscale."
  - name: ingress_tcp_ports
    required: false
    type: "list(number)"
    default: "[80, 443]"
    description: "TCP ports open to the internet."
  - name: ingress_udp_ports
    required: false
    type: "list(number)"
    default: "[]"
    description: "UDP ports open to the internet."
  - name: instances
    required: false
    type: "map(object({ machine_type = optional(string, \"e2-micro\") zone = optional(string) disk_gb = optional(number, 30) disk_type = optional(string, \"pd-standard\") assign_public_ip = optional(bool, true) network_tier = optional(string, \"STANDARD\") swap_size_gb = optional(number, 2) apps = optional(map(object({ compose = string env = optional(map(string), {}) })), {}) }))"
    default: "{ main = {} }"
    description: "Docker hosts to create. See providers/gcp/README.md for the free-tier layout."
  - name: tailscale_auth_key
    required: false
    type: "string"
    default: "null"
    description: "Optional Tailscale auth key; hosts join your tailnet on first boot."
  - name: netbird_setup_key
    required: false
    type: "string"
    default: "null"
    description: "Optional NetBird setup key; hosts join your NetBird network on first boot."
  - name: acknowledge_public_ipv4_charge
    required: false
    type: "bool"
    default: "false"
    description: "Accept the external IPv4 charge (about $3.65/month per address), which the free tier does not cover."
  - name: acknowledge_billable_resources
    required: false
    type: "bool"
    default: "false"
    description: "Allow configurations outside the free tier (machine type, region, disk, instance count)."
