# Generated from stack/variables.tf by a one-off script and kept in step by a test (tests/cli.sh settings_match).
# What a canvas shows as a stack's settings: type and default are the HCL text.
variables:
  - name: region
    required: true
    type: "string"
    description: "AWS region, e.g. us-east-1 or eu-central-1. The Free plan works in every region."
  - name: aws_profile
    required: false
    type: "string"
    default: "null"
    description: "Profile in ~/.aws/config. null uses AWS_PROFILE or the default credential chain."
  - name: availability_zone
    required: false
    type: "string"
    default: "null"
    description: "Pin the hosts to this AZ. null picks the first AZ that offers every instance type."
  - name: name_prefix
    required: false
    type: "string"
    default: "\"freelunch\""
    description: "Prefix for all resource names."
  - name: ssh_public_keys
    required: true
    type: "list(string)"
    description: "SSH public keys authorized on every instance (user `ubuntu`)."
  - name: ssh_source_cidrs
    required: false
    type: "list(string)"
    default: "[\"0.0.0.0/0\"]"
    description: "CIDRs allowed to reach SSH. Use your own IP (x.x.x.x/32), or [] with Tailscale."
  - name: ingress_tcp_ports
    required: false
    type: "list(number)"
    default: "[80, 443]"
    description: "TCP ports open to the internet."
  - name: ingress_udp_ports
    required: false
    type: "list(number)"
    default: "[]"
    description: "UDP ports open to the internet."
  - name: instances
    required: false
    type: "map(object({ instance_type = optional(string, \"t3.micro\") root_volume_gb = optional(number, 20) root_volume_type = optional(string, \"gp3\") assign_public_ip = optional(bool, true) cpu_credits = optional(string, \"standard\") swap_size_gb = optional(number, 2) apps = optional(map(object({ compose = string env = optional(map(string), {}) })), {}) }))"
    default: "{ main = {} }"
    description: "Docker hosts to create. See providers/aws/README.md for Free plan layouts."
  - name: tailscale_auth_key
    required: false
    type: "string"
    default: "null"
    description: "Optional Tailscale auth key; hosts join your tailnet on first boot."
  - name: netbird_setup_key
    required: false
    type: "string"
    default: "null"
    description: "Optional NetBird setup key; hosts join your NetBird network on first boot."
  - name: acknowledge_billable_resources
    required: false
    type: "bool"
    default: "false"
    description: "Allow instance types, volume types or CPU credit modes outside the Free plan."
