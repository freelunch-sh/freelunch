# Generated from stack/variables.tf by a one-off script and kept in step by a test (tests/cli.sh settings_match).
# What a canvas shows as a stack's settings: type and default are the HCL text.
variables:
  - name: name_prefix
    required: false
    type: "string"
    default: "\"freelunch\""
    description: "The names of everything this stack creates start with the project name."
  - name: projects
    required: false
    type: "map(object({ description = optional(string) config = optional(string, \"prd\") }))"
    default: "{ main = {} }"
    description: "Doppler projects to make, keyed by name. Each gets a read-only service token for one config (an environment's secrets), which an app uses as DOPPLER_TOKEN to read its secrets at start (doppler run -- ...). A new project comes with the configs dev, stg and prd."
