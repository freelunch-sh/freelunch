# Generated from stack/variables.tf by a one-off script and kept in step by a test (tests/cli.sh settings_match).
# What a canvas shows as a stack's settings: type and default are the HCL text.
variables:
  - name: name_prefix
    required: false
    type: "string"
    default: "\"freelunch\""
    description: "Prefix of every subscription and database: <name_prefix>-<name>. freelunch init sets it to the project's name."
  - name: databases
    required: false
    type: "map(object({ cloud_provider = optional(string, \"AWS\") region = optional(string, \"us-east-1\") }))"
    default: "{}"
    description: "Free databases to make, keyed by name, e.g. { main = {} }. Each one is a free Essentials subscription with one database in it. cloud_provider is AWS, GCP or AZURE and region is a region the free plan is offered in (us-east-1 ...)."
  - name: acknowledge_billable_resources
    required: false
    type: "bool"
    default: "false"
    description: "Allow more databases than the free plan includes (and plans that cost money)."
