notes: "Free-plan egress fell from 100 GB to 20 GiB in April 2026 and CPU time was cut again later; sources disagree on the CPU figure. Apps pause at the cap instead of being billed. The Terraform provider has had no release since 2023, so freelunch uses the REST API (api.deno.com/v2). It deploys source code, not container images: freelunch api deno-deploy deploy <app> --source <folder>. Written from the OpenAPI spec and tested against a fake API only."
