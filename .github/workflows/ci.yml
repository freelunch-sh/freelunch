name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  TOFU_VERSION: 1.12.7

jobs:
  test:
    name: test (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: terraform
            suites: ""
          # The OCI compute and Azure suites rely on Terraform-only mock features
          # (keyed override targets, partial mock objects), so OpenTofu runs the rest.
          - tool: tofu
            suites: >-
              catalog deploy hybrid shared tests providers/aws providers/cloudflare providers/gcp
              providers/oci/modules/network
    env:
      FREELUNCH_TF: ${{ matrix.tool }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache
    steps:
      - uses: actions/checkout@v7
      - if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: offline tests (mocked providers, fake ssh and docker)
        # word splitting of the suite list is intended
        run: bin/freelunch test ${{ matrix.suites }}

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: fmt
        run: bin/freelunch fmt -check
      - name: shellcheck
        run: shellcheck bin/freelunch tests/cli.sh providers/*/scripts/*.sh
      - name: README checklist matches provider.yaml
        run: |
          bin/freelunch catalog
          git diff --exit-code || { echo "::error::run bin/freelunch catalog and commit the result"; exit 1; }

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build the runner image (amd64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: freelunch:ci
      - name: smoke test
        run: |
          docker run --rm freelunch:ci help | grep -q 'freelunch <command>'
          mkdir -p "$RUNNER_TEMP/demo" && touch "$RUNNER_TEMP/demo/compose.yaml"
          docker run --rm -v "$RUNNER_TEMP/demo:/project" freelunch:ci init
          test -f "$RUNNER_TEMP/demo/.freelunch/apps.tfvars"
