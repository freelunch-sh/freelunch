name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

# A newer push to the same pull request replaces the run in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOFU_VERSION: 1.12.7

jobs:
  test:
    name: test (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: terraform
            suites: ""
          # The OCI compute and Azure suites rely on Terraform-only mock features
          # (keyed override targets, partial mock objects), so OpenTofu runs the rest. The
          # other way round, cockroachdb, mongodb-atlas, tidb-cloud and yugabyte mock nested
          # attributes in a way only OpenTofu accepts: they carry tests/.tofu-only, which makes
          # Terraform skip them, and OpenTofu runs them.
          - tool: tofu
            suites: >-
              catalog deploy hybrid shared tests providers/aws providers/backblaze-b2 providers/cloudflare providers/gcp
              providers/northflank providers/oci/modules/network
              providers/cockroachdb providers/mongodb-atlas providers/tidb-cloud providers/yugabyte
    env:
      FREELUNCH_TF: ${{ matrix.tool }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: offline tests (mocked providers, fake ssh and docker)
        # word splitting of the suite list is intended
        run: bin/freelunch test ${{ matrix.suites }}

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: fmt
        run: bin/freelunch fmt -check
      - name: shellcheck
        # Warnings and errors fail the job; info-level notices (quoting style, A && B || C) do not.
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning bin/freelunch
      - name: README checklist matches provider.yaml
        run: |
          bin/freelunch catalog
          git diff --exit-code || { echo "::error::run bin/freelunch catalog and commit the result"; exit 1; }

  # bash 3.2 is what macOS ships, and the CLI has to keep working on it. Free minutes for a public repository only.
  macos:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: brew install jq
      - name: the CLI suite under the system bash (3.2)
        run: /bin/bash tests/cli.sh

  # The action that projects' workflows use (action.yml), with the version CI tests
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: the action runs the CLI
        uses: ./
        with:
          run: list
          version: ${{ env.TOFU_VERSION }}

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build the runner image (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: freelunch:ci
      - name: smoke test
        run: |
          docker run --rm freelunch:ci help | grep -q 'freelunch <command>'
          mkdir -p "$RUNNER_TEMP/demo" && touch "$RUNNER_TEMP/demo/compose.yaml"
          docker run --rm -v "$RUNNER_TEMP/demo:/project" freelunch:ci init
          test -f "$RUNNER_TEMP/demo/.freelunch/apps.tfvars"
