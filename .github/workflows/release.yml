name: release

# A release is a CHANGELOG.md heading: rename `## [Unreleased]` to `## [1.2.0] - 2026-11-03`
# (with a new empty `## [Unreleased]` above it) and merge that to main. This workflow then
# tags v1.2.0, pushes the image to ghcr.io/<owner>/freelunch as 1.2.0, 1.2 and 1 (no bare 0:
# below 1.0 a minor release can break things), and makes the GitHub release with that section
# as its notes. A version that is tagged already is left alone, so it runs on every change to
# CHANGELOG.md. Run it from the Actions tab to retry.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions: {}

concurrency: release

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: find
        name: the newest version in CHANGELOG.md, unless it has its tag
        run: |
          version="$(sed -n 's/^## \[\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          if [ -z "$version" ]; then echo "no released version in CHANGELOG.md yet"; exit 0; fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "v$version is tagged already"; exit 0; fi
          latest="$(git tag -l 'v*.*.*' | sort -V | tail -1)"
          if [ -n "$latest" ] && [ "$(printf '%s\nv%s\n' "$latest" "$version" | sort -V | tail -1)" != "v$version" ]; then
            echo "::error::CHANGELOG.md says $version, which is older than $latest"; exit 1
          fi
          echo "releasing v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # A tag pushed with the workflow's token starts no other workflow, so the release goes on here.
  tag:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  image:
    needs: [version, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }},enable=${{ !startsWith(needs.version.outputs.tag, 'v0.') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FREELUNCH_VERSION=${{ needs.version.outputs.tag }}
      # Proves the image came from this repository's workflow:
      #   gh attestation verify oci://ghcr.io/freelunch-sh/freelunch:<version> --owner freelunch-sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  notes:
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            on
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
