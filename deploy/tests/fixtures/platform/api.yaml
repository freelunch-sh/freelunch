# Everything a platform service takes from a Compose file.
services:
  api:
    image: ghcr.io/me/api:1.4.2
    command: ["serve", "--port", "8080", "--name", "my api"]
    environment:
      LOG_LEVEL: info
      WORKERS: 2
    env_file: .env
    ports: ["127.0.0.1:8080:8080"]
    expose: ["9090/tcp"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 1m30s
    restart: unless-stopped
