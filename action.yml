# freelunch as a GitHub Action: runs a freelunch command in a job, with the project's state
# from its state store and the files git doesn't have from the FREELUNCH_BUNDLE secret.
# freelunch ci init writes workflows that use it; docs/ci.md has the rest. It runs the
# freelunch version the project pins in .freelunch/version, whichever tag the workflow uses.
# The GitHub Marketplace takes no name that is a GitHub user's, and the user freelunch exists.
name: Run freelunch
description: Run freelunch in a workflow, with the project's state store and the FREELUNCH_BUNDLE secret
branding:
  icon: cloud
  color: green

inputs:
  run:
    description: The freelunch command to run, e.g. deploy, status or ci resume
    required: true
  bundle:
    description: The FREELUNCH_BUNDLE secret (freelunch ci secrets makes it), for projects that keep everything in one secret instead of one secret per credential
    required: false
    default: ""
  tool:
    description: tofu or terraform, whichever the project uses
    required: false
    default: tofu
  version:
    description: Its version, the same as on the machine you work on; empty for the latest
    required: false
    default: ""

outputs:
  url:
    description: The address freelunch up put the app at (the first, when there are several), once it answered
    value: ${{ steps.freelunch.outputs.url }}
  urls:
    description: All the addresses, separated by spaces
    value: ${{ steps.freelunch.outputs.urls }}

runs:
  using: composite
  steps:
    - if: inputs.tool == 'tofu'
      uses: opentofu/setup-opentofu@v2
      with:
        tofu_version: ${{ inputs.version || 'latest' }}
        tofu_wrapper: false
    - if: inputs.tool == 'terraform'
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.version || 'latest' }}
        terraform_wrapper: false
    - id: freelunch
      shell: bash
      env:
        FREELUNCH_BUNDLE: ${{ inputs.bundle }}
        FREELUNCH_TF: ${{ inputs.tool }}
        FREELUNCH_RUN: ${{ inputs.run }}
        # For ci resume, which turns the wait workflow off once the wait is over
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        freelunch="$GITHUB_ACTION_PATH/bin/freelunch"
        # The bundle, or the secrets that hold files (the OCI key, the SSH key for deploy)
        "$freelunch" ci restore
        if [ -z "$FREELUNCH_SSH_KEY" ] && [ -f "$HOME/.ssh/freelunch_deploy" ]; then export FREELUNCH_SSH_KEY="$HOME/.ssh/freelunch_deploy"; fi
        read -ra args <<< "$FREELUNCH_RUN"
        "$freelunch" "${args[@]}"
